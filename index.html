<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>龍龍 3C 實驗室 - LLM Markdown 自動化知識庫</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js 用于將 Markdown 即時渲染為 HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .markdown-body h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 1rem; color: #065f46; border-bottom: 2px solid #10b981; padding-bottom: 0.5rem; }
    .markdown-body h2 { font-size: 1.35rem; font-weight: 600; margin-top: 1.75rem; margin-bottom: 0.75rem; color: #047857; }
    .markdown-body h3 { font-size: 1.15rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #1f2937; }
    .markdown-body p { margin-bottom: 1rem; line-height: 1.75; color: #374151; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #374151; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.925rem; }
    .markdown-body th { background-color: #10b981; color: white; padding: 0.75rem; text-align: left; }
    .markdown-body td { border: 1px solid #e5e7eb; padding: 0.75rem; color: #374151; }
    .markdown-body tr:nth-child(even) { background-color: #f9fafb; }
    .markdown-body blockquote { border-left: 4px solid #10b981; padding-left: 1rem; color: #047857; background: #ecfdf5; padding: 0.75rem 1rem; margin: 1.25rem 0; border-radius: 0 0.5rem 0.5rem 0; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

  <!-- 導覽列 -->
  <header class="bg-white border-b sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer" onclick="showArticleList()">
        <span class="bg-emerald-500 text-white font-black px-2.5 py-1 rounded-lg text-lg shadow-sm">🐉 LONGLONG</span>
        <span class="font-bold text-slate-800 text-lg">3C 實驗室</span>
      </div>
      <nav class="flex items-center gap-6 text-sm font-medium text-slate-600">
        <a href="#" onclick="showArticleList()" class="hover:text-emerald-600 transition">首頁知識庫</a>
        <a href="https://github.com/nek951229-glitch/nuu-ai-u1421208" target="_blank" class="hover:text-emerald-600 transition">GitHub 專案</a>
      </nav>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- 文章列表檢視 (自動生成卡片) -->
    <div id="listView">
      <div class="mb-8 bg-gradient-to-r from-emerald-900 to-slate-900 text-white p-8 rounded-2xl shadow-md border border-emerald-800/50">
        <span class="bg-emerald-500/30 text-emerald-300 text-xs font-medium px-3 py-1 rounded-full border border-emerald-400/30">GitHub API 全自動索引</span>
        <h1 class="text-3xl font-bold mt-3 mb-2">自動生成式音質評測 Wiki</h1>
        <p class="text-emerald-100 text-sm max-w-2xl">只要在 <code class="bg-black/30 px-2 py-0.5 rounded text-emerald-300 font-mono">posts/</code> 資料夾內新增任意 .md 檔案，首頁將透過 GitHub API **自動掃描並即時繪製卡片**，實現完全無需維護 HTML 的架構。</p>
      </div>

      <div class="flex items-center justify-between gap-4 mb-6">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="w-2.5 h-6 bg-emerald-500 rounded-full"></span>自動索引文章列表
        </h2>
        <button onclick="fetchAndRenderArticles()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg border transition flex items-center gap-1">
          🔄 重新掃描 posts/
        </button>
      </div>

      <!-- 自動渲染卡片的容器 -->
      <div class="grid md:grid-cols-3 gap-6" id="cardsGrid">
        <div class="col-span-3 text-center py-12 text-slate-400">正在透過 GitHub API 掃描 posts/ 目錄...</div>
      </div>
    </div>

    <!-- 文章內文檢視 -->
    <div id="detailView" class="hidden">
      <button onclick="showArticleList()" class="mb-6 px-4 py-2 bg-slate-200 hover:bg-emerald-500 hover:text-white text-slate-700 rounded-lg text-sm font-semibold transition">
        ← 返回文章列表
      </button>
      <div class="bg-white p-6 md:p-10 rounded-2xl border border-slate-200 shadow-sm">
        <div id="markdownContent" class="markdown-body">
          <p class="text-slate-400">正在讀取 Markdown 內容...</p>
        </div>
      </div>
    </div>

  </main>

  <footer class="border-t bg-white py-6 text-center text-sm text-slate-500">
    <p>© 2026 龍龍 3C 實驗室 | 聯絡信箱：<a href="mailto:nek951229@gmail.com" class="text-emerald-600 underline">nek951229@gmail.com</a></p>
  </footer>

  <script>
    // GitHub 儲存庫設定
    const REPO_OWNER = 'nek951229-glitch';
    const REPO_NAME = 'nuu-ai-u1421208';
    const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts`;

    // 頁面載入時自動執行目錄掃描
    window.addEventListener('DOMContentLoaded', fetchAndRenderArticles);

    // 1. 透過 GitHub API 自動抓取 posts/ 裡的 .md 檔案並繪製卡片
    async function fetchAndRenderArticles() {
      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = '<div class="col-span-3 text-center py-12 text-slate-400">正在透過 GitHub API 自動掃描 posts/ 資料夾...</div>';

      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('目錄抓取失敗 (請確認 posts/ 資料夾已推送到 GitHub)');
        const files = await res.json();

        // 過濾出所有 .md 檔案
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          cardsGrid.innerHTML = '<div class="col-span-3 text-center py-12 text-slate-400">posts/ 資料夾內尚無任何 .md 檔案</div>';
          return;
        }

        cardsGrid.innerHTML = '';

        // 逐一解析每個 .md 檔案的標題與摘要
        for (const file of mdFiles) {
          try {
            const rawRes = await fetch(file.download_url || file.path);
            const text = await rawRes.text();

            // 提取第一列 `# 標題`
            const titleMatch = text.match(/^#\s+(.+)$/m);
            const title = titleMatch ? titleMatch[1] : file.name;

            // 提取 `發布日期`
            const dateMatch = text.match(/-\s+\*\*發布日期\*\*：(.+)/);
            const date = dateMatch ? dateMatch[1] : '近期發布';

            // 提取第一個非標題的段落作為預覽摘要
            const lines = text.split('\n').filter(l => l.trim() !== '' && !l.startsWith('#') && !l.startsWith('-') && !l.startsWith('|'));
            const summary = lines.length > 0 ? lines[0].replace(/[*#`]/g, '').trim() : '點擊閱讀完整評測文章內文...';

            // 動態新增卡片 HTML
            const cardHtml = `
              <div onclick="loadMarkdown('${file.path}')" class="article-card bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-xl hover:border-emerald-500 transition-all cursor-pointer flex flex-col justify-between group">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-md font-mono">${file.path}</span>
                    <span class="text-xs text-slate-400">${date}</span>
                  </div>
                  <h3 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-emerald-600 transition">${title}</h3>
                  <p class="text-slate-600 text-sm line-clamp-3 leading-relaxed">${summary}</p>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-100 text-emerald-600 font-semibold text-sm flex items-center justify-between">
                  <span>自動讀取內文</span>
                  <span class="group-hover:translate-x-1 transition-transform">→</span>
                </div>
              </div>
            `;
            cardsGrid.insertAdjacentHTML('beforeend', cardHtml);
          } catch (e) {
            console.error('解析檔案失敗:', file.name, e);
          }
        }
      } catch (err) {
        cardsGrid.innerHTML = `<div class="col-span-3 p-6 bg-red-50 text-red-600 rounded-xl border border-red-200 text-center">
          <h3 class="font-bold text-lg mb-1">自動建立卡片失敗</h3>
          <p class="text-sm mb-2">${err.message}</p>
          <p class="text-xs text-slate-500">請確認您的 GitHub 倉庫 posts/ 資料夾內是否有 .md 檔案。</p>
        </div>`;
      }
    }

    // 2. 讀取並渲染指定的 .md 文章
    async function loadMarkdown(filePath) {
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');
      const container = document.getElementById('markdownContent');
      container.innerHTML = '<div class="py-12 text-center text-slate-400">載入文章 <code class="text-emerald-600">' + filePath + '</code> 中...</div>';

      try {
        const response = await fetch(filePath);
        if (!response.ok) throw new Error('無法讀取檔案內容');
        const mdText = await response.text();
        container.innerHTML = marked.parse(mdText);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        container.innerHTML = `<div class="p-6 bg-red-50 text-red-600 rounded-xl border border-red-200">
          <h3 class="font-bold mb-1">載入失敗：${err.message}</h3>
        </div>`;
      }
    }

    // 3. 返回列表
    function showArticleList() {
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('listView').classList.remove('hidden');
    }
  </script>
</body>
</html>
